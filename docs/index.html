<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문서 자료실</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--navy:#12355b;--teal:#1a9c9c;--teal-soft:#e6f5f4;--line:#dbe5ee;--ink:#22303d;--muted:#5f7183;--bg:#f3f8fc;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--navy);color:#fff;padding:20px 16px}
  header h1{margin:0;font-size:1.3rem}
  header p{margin:4px 0 0;font-size:.85rem;opacity:.8}
  main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px;max-width:1400px;margin:0 auto}
  nav{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;align-self:start}
  nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:6px;font:inherit;font-size:.88rem;color:var(--ink);cursor:pointer}
  nav button:hover,nav button.on{background:var(--teal-soft);color:var(--navy);font-weight:500}
  nav small{color:var(--muted);margin-right:6px}
  #view{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0;overflow-x:auto}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  .bar a,.tabs button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 10px;font:inherit;font-size:.82rem;color:var(--navy);text-decoration:none;cursor:pointer}
  .tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  table{border-collapse:collapse;font-size:.82rem}
  td,th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;white-space:pre-wrap}
  .md table th{background:var(--teal-soft)}
  .muted{color:var(--muted)}
  @media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>문서 자료실</h1><p>docs 폴더 파일 목록 — 파일 선택 시 내용 표시</p></header>
<main>
  <nav id="list"></nav>
  <section id="view"><p class="muted">왼쪽 목록에서 파일 선택 필요</p></section>
</main>
<script>
const FILES = [
  "기획안_예시.md",
  "순천1기_김찬미_06_W2-1_페르소나·PainPoint·CJM_양식.xlsx",
  "순천1기_김찬미_07_W2-2_사용자의말·CJMv1·한문장_양식.xlsx",
  "순천1기_김찬미_11_W3-1_누가말했나·시장한문장_양식.xlsx",
  "순천1기_김찬미_12_W3-2_어디서·조사종합_양식.xlsx",
  "순천1기_김찬미_17_W4-2_막힘진단·v1대조_양식.xlsx"
];
const list = document.getElementById('list'), view = document.getElementById('view');

FILES.forEach(f => {
  const b = document.createElement('button');
  b.innerHTML = `<small>${f.endsWith('.md') ? 'MD' : 'XLSX'}</small>`;
  b.append(f.replace(/\.(md|xlsx)$/, ''));
  b.onclick = () => { list.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); show(f); location.hash = encodeURIComponent(f); };
  list.append(b);
});

async function show(f) {
  const url = encodeURIComponent(f);
  view.innerHTML = '<p class="muted">불러오는 중…</p>';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    const bar = `<div class="bar"><strong>${f}</strong><a href="${url}" download>다운로드</a></div>`;
    if (f.endsWith('.md')) {
      view.innerHTML = bar + '<div class="md">' + marked.parse(await res.text()) + '</div>';
    } else {
      const wb = XLSX.read(await res.arrayBuffer());
      view.innerHTML = bar + '<div class="tabs bar"></div><div id="sheet"></div>';
      const tabs = view.querySelector('.tabs'), sheet = view.querySelector('#sheet');
      wb.SheetNames.forEach((n, i) => {
        const t = document.createElement('button');
        t.textContent = n;
        t.onclick = () => { tabs.querySelectorAll('button').forEach(x => x.classList.remove('on')); t.classList.add('on'); sheet.innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[n]); };
        tabs.append(t);
        if (i === 0) t.click();
      });
    }
  } catch (e) {
    view.innerHTML = `<p class="muted">파일 로드 실패 (${e.message})</p>`;
  }
}

const h = decodeURIComponent(location.hash.slice(1));
if (FILES.includes(h)) list.children[FILES.indexOf(h)].click();
</script>
</body>
</html>
